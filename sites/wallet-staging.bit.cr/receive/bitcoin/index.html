<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title data-i18n="title.receive.staging">Open staging receive request in Bitcredit Wallet</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/wallet-icon.png">
    <script src="/site-config.js" defer></script>
    <script src="/i18n.js" defer></script>
    <script src="/qr.js" defer></script>
    <script src="/fallback.js" defer></script>
  </head>
  <body data-action="receive" data-scheme="bcrwallet-staging">
    <header class="site-header">
      <img src="/bitcredit-logo.svg" width="132" height="19" alt="Bitcredit">
    </header>
    <main>
      <div class="action">
        <section class="card">
          <div class="title">
            <p class="environment" data-i18n="staging.label">Staging</p>
            <h1 data-i18n="receive.heading">You’ve received e-cash</h1>
            <p id="status" data-i18n="receive.subtitle">Install Bitcredit eCash<br>
              to receive your payment.</p>
          </div>
          <figure class="desktop-qr" id="desktop-qr" hidden>
            <div class="qr-code" id="qr-code" role="img" aria-label="QR code for this wallet link" data-i18n-label="qr.label"></div>
            <figcaption data-i18n="qr.caption">Scan to open on your phone</figcaption>
          </figure>
          <div class="actions" id="open-installed">
            <button class="primary" id="open-wallet" type="button" data-i18n="open.staging">Open staging wallet</button>
          </div>
        </section>
        <section class="after-install" aria-labelledby="after-install-title">
          <h2 id="after-install-title" data-i18n="after.heading">After installation:</h2>
          <p data-i18n="receive.after">Open this link again to receive your e-cash in your new Bitcoin wallet.</p>
        </section>
        <noscript><p class="open-installed">JavaScript is required to pass this link to the wallet app.</p></noscript>
      </div>
    </main>
    <footer class="site-footer">
      <p><span data-i18n="footer.copyright">© 2026 Bitcredit Protocol.</span><br class="footer-break"> <span data-i18n="footer.released">Released under the</span> <a href="https://opensource.org/license/mit/" target="_blank" rel="noopener noreferrer" data-i18n="footer.license">MIT license</a>.</p>
      <nav class="language-switch" id="language-switch" aria-label="Language" data-i18n-label="language.label" hidden>
        <button class="link-button" type="button" lang="en" data-language="en">English</button>
        <span aria-hidden="true">·</span>
        <button class="link-button" type="button" lang="es" data-language="es">Español</button>
      </nav>
    </footer>
  </body>
</html>

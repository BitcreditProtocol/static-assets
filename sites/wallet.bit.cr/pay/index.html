<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>Open payment in Bitcredit Wallet</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/wallet-icon.png">
    <script src="/site-config.js" defer></script>
    <script src="/qr.js" defer></script>
    <script src="/fallback.js" defer></script>
  </head>
  <body data-action="pay" data-scheme="bcrwallet">
    <header class="site-header">
      <img src="/bitcredit-logo.svg" width="132" height="19" alt="Bitcredit">
    </header>
    <main>
      <div class="action">
        <section class="card">
          <div class="title">
            <h1>You’ve received<br>
              a payment request</h1>
            <p id="status">Install Bitcredit eCash<br>
              to review and pay the request.</p>
          </div>
          <figure class="desktop-qr" id="desktop-qr" hidden>
            <div class="qr-code" id="qr-code"></div>
            <figcaption>Scan to open on your phone</figcaption>
          </figure>
          <div class="actions" aria-label="Install Bitcredit eCash">
            <a class="store-badge app-store" id="ios-install" href="https://apps.apple.com/app/id6764422592" target="_blank" rel="noopener noreferrer">
              <img src="/app-store-icon.svg" width="20" height="24" alt="">
              <span class="store-badge-label">
                <span class="store-badge-caption">Download on the</span>
                <span class="store-badge-name">App Store</span>
              </span>
            </a>
            <a class="store-badge google-play" id="android-install" href="https://play.google.com/store/apps/details?id=org.bitcr.wallet" target="_blank" rel="noopener noreferrer">
              <img src="/google-play-icon.svg" width="21" height="24" alt="">
              <span class="store-badge-label">
                <span class="store-badge-caption">Get it on</span>
                <img class="google-play-wordmark" src="/google-play-wordmark.svg" width="74" height="15" alt="Google Play">
              </span>
            </a>
          </div>
        </section>
        <section class="after-install" aria-labelledby="after-install-title">
          <h2 id="after-install-title">After installation:</h2>
          <ol class="steps">
            <li><span>Fund your wallet.</span></li>
            <li><span>Open this link again to review the request and pay.</span></li>
          </ol>
        </section>
        <p class="open-installed" id="open-installed">
          <button class="link-button" id="open-wallet" type="button">Already have the app? Open it now</button>
        </p>
        <noscript><p class="open-installed">JavaScript is required to pass this link to the wallet app.</p></noscript>
      </div>
    </main>
    <footer class="site-footer">
      <p>© 2026 Bitcredit Protocol.<br class="footer-break"> Released under the <a href="https://opensource.org/license/mit/" target="_blank" rel="noopener noreferrer">MIT license</a>.</p>
    </footer>
  </body>
</html>
